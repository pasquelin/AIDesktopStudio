packages:
  - .

allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: false
  esbuild: true
  # Its postinstall picks the prebuilt binary for this machine — Metal, CUDA or Vulkan. Refused,
  # the package installs without the one file that makes it run.
  node-llama-cpp: true
minimumReleaseAgeExclude:
  - immer@11.1.16
  - jscpd-darwin-arm64@5.0.15
  - jscpd-darwin-x64@5.0.15
  - jscpd-linux-arm64-gnu@5.0.15
  - jscpd-linux-x64-gnu@5.0.15
  - jscpd-linux-x64-musl@5.0.15
  - jscpd-windows-x64-msvc@5.0.15
  - jscpd@5.0.15
  - mediabunny@1.53.1 || 1.55.7
  - zustand@5.0.15
  - dockview-core@8.1.0
  - dockview-react@8.1.0
  - dockview@8.1.0
  - '@pasquelin/panels@0.4.1'
