<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>AI Desktop Studio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        padding: 34px 40px 30px;
        overflow: hidden;
        display: grid;
        grid-template-rows: 1fr auto;
        justify-items: center;
        /* The tile colour of build/icon.svg, lit from where the mark sits: the splash and the Dock
           icon must read as one object. */
        background: radial-gradient(ellipse at 50% 42%, #202124 0%, #161921 58%, #191a1c 100%);
        color: #dfe1e5;
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        user-select: none;
        cursor: default;
        -webkit-app-region: drag;
      }
      .stage {
        align-self: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .mark {
        width: 148px;
        height: auto;
        flex: none;
      }
      .name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.34em;
        /* Uppercased by the sheet, never in the markup: `appName.test.ts` reads the name as data. */
        text-transform: uppercase;
        /* The tracking is applied to the right of each letter, the last one included. */
        text-indent: 0.34em;
      }
      .name b {
        font-weight: 600;
        color: #6193f3;
      }
      .version {
        font-size: 11px;
        color: #91959b;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
      }
      .track {
        width: 70%;
        height: 3px;
        background: #34363a;
        border-radius: 3px;
        overflow: hidden;
      }
      /* Indeterminate: startup is one synchronous block, so any percentage would be invented. */
      .fill {
        height: 100%;
        width: 40%;
        background: #346ef2;
        border-radius: 3px;
        /* The glow is the mark's own blue, one step lighter — the maquette's lit bar. */
        box-shadow: 0 0 10px 1px #6193f3;
        animation: sweep 1.25s ease-in-out infinite;
      }
      @keyframes sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fill {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <!--
        The icon's monogram, without its tile: this surface already paints the tile colour. COPIED
        rather than imported — a separate Vite entry under `default-src 'none'` reaches no file.
        `splash.test.ts` pins every SHAPE below to `build/icon.svg`; the viewBox that frames them
        is pinned by no one, so a mark that moves inside the 1024 grid crops here, silently.
      -->
      <svg class="mark" viewBox="149 317 726 436" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M165 706 349 350q33-64 66 0l184 356q16 31-19 31h-61q-18 0-26-16L382 506q-7-14-14 0L257 721q-8 16-26 16h-61q-35 0-5-31Z"
          fill="#fff"
        />
        <path d="M340 721 382 639l42 82q8 16-10 16h-64q-18 0-10-16Z" fill="#346ef2" />
        <circle cx="540" cy="379" r="46" fill="#346ef2" />
        <rect x="494" y="453" width="92" height="284" rx="42" fill="#346ef2" />
        <path
          d="M617 453h72q170 0 170 142t-170 142h-72v-70h65q79 0 79-72t-79-72h-65Z"
          fill="#fff"
        />
      </svg>
      <div class="name"><b>AI</b> Desktop Studio</div>
      <div class="version" id="version"></div>
    </div>
    <div class="track"><div class="fill"></div></div>
    <script type="module" src="/src/splash.ts"></script>
  </body>
</html>
