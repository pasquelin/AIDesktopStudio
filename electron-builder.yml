appId: com.pasquelin.iastudio
# `productName` is deliberately absent: electron-builder would prefer it over the one in
# package.json, which is the copy `shared/constants.test.ts` pins to APP_NAME. Declaring it
# here would leave the shipped name unguarded.
copyright: © 2026 Alban Pasquelin

directories:
  output: release
  buildResources: build

# `beforePack` fetches into `resources/ffmpeg/`, emptying it first — the binaries differ in name
# per platform. Two targets packed at once would take each other's encoder. This is the default,
# declared so a change of default cannot silently break it.
concurrency:
  jobs: 1

# Name, version, platform and architecture, in that order: the two macOS installers differ only
# by the last field, and a release page listing them has to make that legible.
artifactName: ${name}-${version}-${platform}-${arch}.${ext}

# The release is created as a draft by the `release` job, never by the build matrix — see
# docs/ci/adr/ADR-06. Nothing reaches an installed client until the draft is published by hand.
publish:
  provider: github
  owner: pasquelin
  repo: IAStudio
  releaseType: draft

files:
  - out/**
  - package.json
  # Read at runtime by `nativeImage`: window icon on Windows and Linux, About dialog.
  - build/icon.png
  - '!**/*.map'

# Une déclaration alimente les rôles macOS, le registre Windows et les types MIME Linux.
fileAssociations:
  - name: Médias IA Studio
    role: Editor
    ext:
      - glb
      - obj
      - fbx
      - stl
      - ply
      - dae
      - usdz
      - bvh
      - gltf
      - png
      - ora
      - jpg
      - jpeg
      - webp
      - avif
      - gif
      - svg
      - tif
      - tiff
      - exr
      - hdr
      - mp4
      - mov
      - mkv
      - webm
      - avi
      - mxf
      - m4v
      - wav
      - mp3
      - flac
      - ogg
      - m4a
      - aac
      - aiff
      - otio
      - otioz
      - mtlx

# `devTools: false` is a per-webContents preference; these are process-level switches that
# would otherwise reopen the same door. `--remote-debugging-port` attaches CDP to the main
# world where `window.studio` lives, and does so under the app's own signing identity —
# which is what safeStorage ties the keychain entry to.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # The signature must be reset after flipping fuses, or the binary no longer validates.
  resetAdHocDarwinSignature: true

# A native module cannot be loaded from inside the asar archive.
asarUnpack:
  - '**/*.node'
  # The recognition engine ships four dynamic libraries beside its `.node`, and the loader reads
  # them from disk by name. The rule above unpacks the addon alone, which loads and then fails
  # looking for a `libonnxruntime.dylib` still sealed in the archive.
  - '**/sherpa-onnx-*/**'
  # llama.cpp is the same shape: `llama-addon.node` sits beside `libllama`, `libggml-base` and one
  # `libggml-cpu-*` per micro-architecture, all opened from disk by name. Unpacking the addon
  # alone gives a packaged build that loads it and then fails looking for its libraries.
  - '**/@node-llama-cpp/**'

# The encoder the studio ships with. `beforePack` fetches the one matching the target about to
# be packed, so a run building several of them gives each its own. Outside the asar on purpose:
# a binary has to be executable on disk to be spawned.
beforePack: scripts/before-pack.mjs

extraResources:
  # Le runtime qu'un jeu exporté embarque — un module ES bâti par `pnpm game:runtime`. Hors de
  # l'asar parce qu'il est COPIÉ dans le dossier du jeu, et qu'on ne copie pas depuis une archive.
  - from: resources/gameRuntime
    to: gameRuntime
    filter: ['**/*']
  - from: resources/ffmpeg
    to: ffmpeg
    filter: ['**/*']
  # The voice detector dictation listens through — 640 KB, fetched by `pnpm stt:fetch` and
  # verified against a pinned digest. Shipped rather than downloaded because it is small, and
  # because it lets the microphone be checked before the 640 MB recognition model is there.
  - from: resources/stt
    to: stt
    filter: ['**/*']
  # The interpreter, engine sources and pinned Auto Rig dependencies are materialized by the
  # before-pack hook for the target architecture. They stay outside the asar because the Python
  # executable and its native tensor libraries must be spawned and signed with the application.
  - from: resources/engine
    to: engine
    filter: ['**/*']
  # The animations a character can be made to play, one folder each. In the repository rather
  # than fetched: they are the only thing the animations panel has to offer on a fresh install.
  - from: resources/animations
    to: animations
    filter: ['**/*']
  # The character the app ships with, one GLB per density — the body a player module is born
  # wearing. Four levels rather than one: a project copies in the level it is asked for, and the
  # rest stay here rather than in every project folder.
  - from: resources/characters
    to: characters
    filter: ['**/*.glb']
  # The grid and the checker a primitive is born wearing, and the stills drawn of each scene
  # template. Redrawn rather than fetched — `pnpm textures:make` writes them, and they are the
  # only thing a new scene has to show for itself before anything is modelled.
  - from: resources/textures
    to: textures
    filter: ['**/*.png']
  # `.png` alone, unlike the three above: the folder carries a note saying how the stills are
  # produced, and a readme has no business inside an application bundle.
  - from: resources/templates
    to: templates
    filter: ['**/*.png']
  # One picture per local model, about a kilobyte each, written by `pnpm models:thumbnails`.
  # Shipped rather than fetched for the reason the whole catalogue is: they have its life cycle,
  # so no link can die and a panel draws offline.
  - from: resources/models
    to: models
    filter: ['**/*.png']
  # Beside the application rather than only inside its Help window: a notice reachable only from
  # a running app is out of reach for whoever cannot start it, and the FFmpeg source offer has to
  # survive that. Both are generated or hand-written at the repository root, never duplicated.
  - from: EULA.md
    to: EULA.md
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md

mac:
  # The permission sentence, once per language. macOS reads `InfoPlist.strings` from the `.lproj`
  # matching the reader's language and falls back to `extendInfo` below for every other one, so a
  # French user sees a French reason where they used to read English under a French dialog.
  #
  # Under `mac:` rather than at the root: an `.lproj` folder means nothing to Windows or Linux.
  # electron-builder has no localisation feature of its own — it only places the files — which is
  # why this was long called untranslatable. It is not; it is unassembled.
  extraResources:
    - from: build/lproj
      to: .
      filter: ['**/*']
  category: public.app-category.graphics-design
  icon: build/icon.svg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The value Electron 43 already carries in its Info.plist, written down so it stops being
  # implicit: electron-updater reads it to decide whether a client may take an update.
  minimumSystemVersion: '12.0'
  extendInfo:
    # macOS shows this sentence in the permission dialog, and kills the process outright if the
    # key is missing when the microphone is first touched. Not localised: an Info.plist string
    # needs an `InfoPlist.strings` per language, which electron-builder does not assemble.
    NSMicrophoneUsageDescription:
      IA Studio uses the microphone to turn what you say into text, on this computer.
      Nothing you say is sent anywhere.
  # `notarize` is deliberately left at its default rather than pinned to false: electron-builder
  # only notarises what it managed to sign, so an unsigned build skips it on its own — and the
  # day the secrets of ADR-07 exist, signing and notarising both start without touching this
  # file. No Apple Developer Program is subscribed today; see docs/ci/adr/ADR-04.
  # Signed with the app, or the hardened runtime refuses to spawn it — an unsigned executable
  # inside a signed bundle is exactly what Gatekeeper is there to stop.
  binaries:
    - Contents/Resources/ffmpeg/ffmpeg
    - Contents/Resources/ffmpeg/ffprobe
  target:
    - target: dmg
      arch: [arm64, x64]
    # Not for distribution: electron-updater consumes the zip, and it is cheap to keep.
    - target: zip
      arch: [arm64, x64]

dmg:
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

win:
  icon: build/icon.svg
  target:
    - target: nsis
      arch: [x64]

nsis:
  # The terms of use of the binary, not the source-available licence of the repository: two
  # different texts, and only this one governs what an installer hands over. Per target — there is
  # no root `license` key, and declaring one fails `validateConfiguration` before any platform is
  # packaged. Not set under `dmg`: a licence there gates mounting the image every single time.
  license: EULA.md
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per user, so installing needs no administrator: the studio writes to the user's own folders
  # and has nothing to register machine-wide.
  perMachine: false
  createDesktopShortcut: true
  # Projects, settings and the encrypted API key live in appData. Uninstalling a version — to
  # reinstall another — must not take the work with it.
  deleteAppDataOnUninstall: false

linux:
  icon: build/icon.svg
  category: Graphics
  synopsis: Image, video, 3D, audio, texture and skybox creation studio
  maintainer: Alban Pasquelin <alban.pasquelin@gmail.com>
  # The one surface of the studio that ships its wording instead of reading it: a `.desktop` file
  # is written at build time and read by the desktop shell, long before any bundle is loaded. It
  # localises the only way it can — one key per locale, `Comment` being the C fallback.
  desktop:
    entry:
      StartupWMClass: IA Studio
      Comment: Image, video, 3D, audio, texture and skybox creation studio
      Comment[fr]: Studio de création d’images, vidéos, modèles 3D, audio, textures et skyboxes
  target: [AppImage, deb]

appImage:
  license: EULA.md
