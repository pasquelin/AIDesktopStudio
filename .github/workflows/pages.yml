# Vitrine GitHub Pages. Squelette commun aux trois dépôts (map3D, panels, AI Desktop Studio) :
# mêmes déclencheurs, mêmes versions d'actions, même artefact `_site`. Ce qui diffère ici
# tient à la seule particularité réelle de ce dépôt — le manifeste de version.
#
# Ce que ce workflow ajoute et que la page ne peut pas savoir toute seule : quelle version
# est sortie, et où vivent ses cinq installeurs. Il écrit `site/assets/release.json`, que
# `main.js` lit pour remplir la pastille de version et les cartes de téléchargement.
#
# Rien n'est réécrit dans le dépôt : le fichier est produit dans l'artefact déployé, donc
# aucun tag ne crée de commit, et `site/` reste libre d'un fichier généré qui entrerait en
# conflit à chaque fusion.
#
# Le déclencheur est la PUBLICATION d'une release, pas le tag : `release.yml` bâtit les trois
# plateformes et laisse un BROUILLON, délibérément (ADR-06). Déployer sur le tag annoncerait
# des installeurs que personne n'a encore relus.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'repo.config.json'
      - 'package.json'
      - '.github/workflows/pages.yml'
  # Les mêmes chemins en pull request : on bâtit sans déployer, pour qu'une vitrine
  # cassée se voie avant la fusion et non après.
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'repo.config.json'
      - 'package.json'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours : une publication à moitié
# écrite est pire qu'une publication en retard.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Pas de `pnpm install`, et c'est voulu : `site/build.mjs` est du Node pur sans une
      # seule dépendance — comme dans les deux autres dépôts. Ici cela évite d'installer
      # Electron pour rendre quinze pages HTML. Le garde-fou du code est joué par `ci.yml`
      # sur chaque push et chaque pull request ; le rejouer ici ne trouverait rien de plus.

      # La release qui a DÉCLENCHÉ ce run, s'il y en a une : `/releases/latest` est une
      # ressource à part, et sa cohérence est différée — lue dix secondes après la sortie
      # publique de v1.0.0, le 20/08, elle répondait encore v0.2.0, et le site annonçait la
      # version précédente avec les liens précédents, depuis un run vert. La charge utile de
      # l'événement porte la release elle-même : il n'y a donc rien à demander.
      # `/releases/latest` reste la source pour un dispatch ou un push, et répond 404 avant
      # la première release — le cas normal, où la page garde sa formulation d'origine.
      #
      # Brouillons et préversions : `/releases/latest` filtre les deux, la charge utile non,
      # d'où la lecture des deux drapeaux — sans quoi une préversion publiée arriverait sur
      # le site.
      - name: Écrire le manifeste de version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          source="repos/${GITHUB_REPOSITORY}/releases/latest"
          if [ -n "${RELEASE_TAG:-}" ] \
            && [ "${RELEASE_DRAFT:-}" = "false" ] \
            && [ "${RELEASE_PRERELEASE:-}" = "false" ]; then
            source="repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          fi

          if ! gh api "$source" > release.json 2>/dev/null; then
            echo "Aucune version publiée — la page garde sa formulation d'origine." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Chaque carte est appariée sur le nom d'artefact que produit electron-builder,
          # `${name}-${version}-${platform}-${arch}.${ext}` — cf. electron-builder.yml.
          # Une plateforme absente de la release garde son libellé plutôt que d'offrir un 404.
          jq '{
            tag: .tag_name,
            published: .published_at,
            assets: (
              .assets
              | map({
                  key: (
                    if   .name | test("darwin.*arm64.*\\.dmg$")  then "darwin-arm64"
                    elif .name | test("darwin.*x64.*\\.dmg$")    then "darwin-x64"
                    elif .name | test("win32.*\\.exe$")          then "win32-x64"
                    elif .name | test("\\.AppImage$")            then "linux-AppImage"
                    elif .name | test("\\.deb$")                 then "linux-deb"
                    else empty end
                  ),
                  value: {
                    url: .browser_download_url,
                    size: ((.size / 1048576) | floor | tostring + " Mo")
                  }
                })
              | from_entries
            )
          }' release.json > site/assets/release.json

          rm release.json
          echo "Version publiée : $(jq -r .tag site/assets/release.json)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.assets | keys[] | "- " + .' site/assets/release.json >> "$GITHUB_STEP_SUMMARY"

      # Une seule commande bâtit tout le site : les quinze langues, les assets, le sitemap
      # et robots.txt. Le rendu échoue si un dictionnaire est désaccordé — c'est le garde-fou
      # qui compte ici, et il est dans le moteur, pas dans ce fichier.
      - run: pnpm build:site

      # Sur `release: published`, GITHUB_REF vaut refs/tags/<tag> et jamais
      # refs/heads/main : tester la seule branche sautait tout le déploiement à
      # la publication — le déclencheur pour lequel le manifeste est écrit.
      - uses: actions/configure-pages@v6
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        with:
          path: _site

      # Le même rendu, en artefact ordinaire, pour le serveur. Deux artefacts
      # plutôt qu'un : `upload-pages-artifact` produit un tar au format propre à
      # Pages, que `download-artifact` ne sait pas rouvrir. Et surtout, rebâtir
      # dans l'autre job donnerait un site SANS `assets/release.json` — il est
      # écrit ici, à partir de la charge utile de l'événement, qu'un second job
      # ne reçoit pas.
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        with:
          name: site
          path: _site
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Le serveur qui sert www.aidesktopstudio.com — l'URL canonique depuis la
  # refonte. Pages reste déployé en miroir : les deux rendus sont identiques et
  # portent la même balise canonique, donc rien n'est dupliqué aux yeux d'un
  # moteur.
  #
  # Ce job ne dépend PAS de `deploy` : une panne de Pages ne doit pas priver le
  # domaine de sa mise à jour, et réciproquement.
  deploy-server:
    needs: build
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: _site

      # `--delete` en fin de course efface du serveur ce que l'artefact ne
      # contient pas : un artefact vide ou tronqué effacerait donc le site en
      # ligne, sans qu'aucune étape ne rougisse. On refuse d'aller plus loin.
      - name: Refuser un rendu vide
        run: |
          test -s _site/index.html || { echo "Artefact sans index.html — arrêt avant rsync." >&2; exit 1; }
          # Le rendu compte 33 fichiers au 2026-09-07 : une page par langue, les
          # assets, le sitemap et robots.txt. Le plancher est bas exprès — il
          # attrape l'artefact vide ou à moitié téléchargé, pas une page en moins.
          n=$(find _site -type f | wc -l)
          echo "$n fichiers à déployer"
          [ "$n" -ge 20 ] || { echo "Seulement $n fichiers, le rendu en produit une trentaine." >&2; exit 1; }

      # nginx sert `page.html.gz` à la place de `page.html` quand il le trouve
      # (`gzip_static on`), sans rien recompresser à chaque requête. Fait ici en
      # -9, ce que la compression à la volée ne se permet jamais.
      # Images et vidéos sont déjà compressées : les gziper les alourdirait.
      - name: Précompresser
        run: |
          find _site -type f \
            \( -name '*.html' -o -name '*.css' -o -name '*.js' \
               -o -name '*.svg' -o -name '*.json' -o -name '*.xml' -o -name '*.txt' \) \
            -exec gzip -9 -k -f {} +

      - name: Clé de déploiement
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY"   > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      # Le `/` distant n'est pas la racine du serveur : la clé est enfermée par
      # `command="rrsync -wo <dossier>"` dans authorized_keys, et tout chemin est
      # relatif à ce dossier. Cette clé ne peut donc rien faire d'autre
      # qu'écrire le site — pas de shell, pas d'autre répertoire.
      #
      # `--delete` retire du serveur ce que le rendu ne produit plus ; sans lui
      # une page supprimée resterait en ligne indéfiniment.
      - name: Déployer
        env:
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          # Sans --delete-delay les suppressions s'entrelacent aux transferts, et
          # un visiteur lit une page dont le CSS n'est pas encore arrivé.
          # L'exclusion protège le challenge ACME le jour où le vhost le servirait
          # depuis ici plutôt que depuis /var/www/html.
          rsync -rltz --delete-delay --delay-updates --stats \
            --exclude '.well-known/' \
            -e "ssh -p $PORT -i ~/.ssh/deploy -o StrictHostKeyChecking=yes" \
            _site/ "$TARGET:/"

      - name: Vérifier
        run: |
          # rsync a déjà réussi à ce stade : un échec ici doit venir du site, pas
          # d'un aléa réseau. D'où le délai borné et les deux reprises. -L parce
          # qu'une redirection ajoutée à la racine reste une réponse saine.
          code=$(curl -sL -o /dev/null -w '%{http_code}' \
            --max-time 15 --retry 2 --retry-delay 3 \
            https://www.aidesktopstudio.com/)
          echo "https://www.aidesktopstudio.com/ → $code" >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ] || { echo "Le site répond $code au lieu de 200." >&2; exit 1; }
