name: CI

# Linux only, and no Electron packaging: what breaks a pull request is whatever the gate judges —
# a type, a rule, a test, a dead export — and those answer in minutes. The three-OS matrix belongs
# to release.yml — see docs/ci/adr/ADR-09-budget-minutes-ci.md.
on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Not a link of the gate: `pnpm validate` runs `engine:check` itself. This only puts the
      # tool that link shells out to on PATH — the engine is Python, and uv drives it.
      - uses: astral-sh/setup-uv@v10.0.1

      - run: pnpm install --frozen-lockfile

      # The gate itself, not a copy of its links. Spelling them out one by one gave a prettier
      # step list and a job that silently stopped matching the desk: `unused:main` was added to
      # `validate` and this file kept passing pull requests with dead code. `validate` fails on
      # its first red link exactly as before — the log names it, the step list no longer does.
      # `pnpm build` is one of those links, so the bundle and `check-artefact` run here through it.
      - run: pnpm validate
